name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Backend Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/GrowthLog.sln

      - name: Build Solution
        run: dotnet build backend/GrowthLog.sln --no-restore --configuration Release

      - name: Run Unit & Integration Tests
        run: dotnet test backend/GrowthLog.sln --no-build --configuration Release --verbosity normal

  frontend-build-test:
    name: Frontend Build & Lint (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Type Check & Vite Build
        working-directory: ./frontend
        run: npm run build
